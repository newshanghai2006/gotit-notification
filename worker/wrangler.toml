name = "gotit-api"
main = "src/index.ts"
compatibility_date = "2025-05-01"

[[d1_databases]]
binding = "DB"
database_name = "gotit"
database_id = "replace-with-d1-database-id"

[[kv_namespaces]]
binding = "OTP"
id = "replace-with-kv-namespace-id"

[vars]
APP_ORIGIN = "*"
DEV_AUTH_ENABLED = "true"
# Set these as secrets with `wrangler secret put`: API_TOKEN, RESEND_API_KEY, EXPO_ACCESS_TOKEN
